<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the header colour reach behind the phone's notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline Scout</title>
  <meta name="description" content="Offline-first scouting for FIRST robotics. Works with no internet.">
  <meta name="theme-color" content="#0e0e10">
  <meta name="color-scheme" content="dark light">

  <!-- Installable app ("Add to Home Screen") -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scout">

  <link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Every screen is drawn into #app by js/app.js -->
  <div id="app"></div>
  <noscript>Offline Scout needs JavaScript turned on.</noscript>
</body>
</html>
